# Cloudflare Workers settings for the Lemoria Luxe website.
# Cloudflare build:  Build command  npm run build   ·   Deploy command  npx wrangler deploy
#
# Email: the public settings are in [vars] below. The two private ones must be added as runtime SECRETS
# (not build variables): Workers & Pages > lemoria-website > Settings > Variables and Secrets
#   SMTP_USER = the Gmail address that owns the App Password
#   SMTP_PASS = the 16-character Gmail App Password
# or from a terminal:  npx wrangler secret put SMTP_USER   and   npx wrangler secret put SMTP_PASS
name = "lemoria-website"            # must match the Worker name in the Cloudflare dashboard
main = "worker/index.js"            # handles /api/enquiry (the email)
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Keep the variables you add in the dashboard when a new version is deployed.
keep_vars = true

# Public email settings (safe to keep in the code).
[vars]
MAIL_TO = "lemoriacoworks@gmail.com"
MAIL_FROM = "Lemoria Luxe <lemoriacoworks@gmail.com>"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_SECURE = "true"

# The website files built by Vite.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"   # direct links like /conference-cabins open the app
run_worker_first = ["/api/*"]                    # only /api/* runs the Worker code

# Keep logs so email errors can be seen under Observability in the dashboard.
[observability]
enabled = true
