# Cloudflare Pages settings for the Lemoria website.
# Build command: npm run build   ·   Build output directory: dist
# Email settings (SMTP_*, MAIL_*) are NOT stored here: add them in the Cloudflare dashboard under
# Workers & Pages > lemoria-website > Settings > Variables and Secrets (SMTP_PASS as a Secret).
name = "lemoria-website"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
